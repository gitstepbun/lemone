# Staging/produksi. Jalankan dari akar repo:
#   docker compose -f infra/docker-compose.yml -f infra/prod/docker-compose.prod.yml --env-file .env up -d --build
# Keycloak di sini memakai `start` (bukan start-dev) dengan hostname auth.lemone.work di balik Caddy (TLS di Caddy).
name: lemone

services:
  keycloak:
    command: ["start", "--import-realm", "--http-port=8080", "--proxy-headers=xforwarded", "--hostname=${KC_PUBLIC_URL}", "--http-enabled=true"]
    ports: !override []
    environment:
      KC_HOSTNAME_STRICT: "true"

  postgres:
    ports: !override []

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://lemone_api:${API_DB_PASSWORD}@postgres:5432/lemone
      KC_ADMIN_URL: http://keycloak:8080
    depends_on: [postgres, keycloak]

  worker:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://lemone_api:${API_DB_PASSWORD}@postgres:5432/lemone
      KC_ADMIN_URL: http://keycloak:8080
      WORKER_ID: worker-1
    depends_on: [postgres, keycloak]

  work-web:
    build: { context: ../.., dockerfile: apps/work-web/Dockerfile }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_CHAT_URL: ${CHAT_PUBLIC_URL}

  chat-web:
    build: { context: ../.., dockerfile: apps/chat-web/Dockerfile }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_WS_URL: ${CHAT_WS_URL:-wss://lemone.chat/ws}

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, work-web, chat-web, keycloak]

volumes:
  caddy_data:
