# Disisipkan ke server block https lemone.work yang sudah ada (include snippets/lemone-work-portal.conf;).
# Rute portal akun + IdP; situs lama tetap melayani path lainnya.
location = /user { proxy_pass http://127.0.0.1:13001; include snippets/lemone-proxy.conf; }
location /user/ { proxy_pass http://127.0.0.1:13001; include snippets/lemone-proxy.conf; }
location /activate { proxy_pass http://127.0.0.1:13001; include snippets/lemone-proxy.conf; add_header Cache-Control "no-store" always; add_header Referrer-Policy "no-referrer" always; }
location /masuk { proxy_pass http://127.0.0.1:13001; include snippets/lemone-proxy.conf; }
location /akun-belum-aktif { proxy_pass http://127.0.0.1:13001; include snippets/lemone-proxy.conf; }
location /_next/ { proxy_pass http://127.0.0.1:13001; include snippets/lemone-proxy.conf; }
location /api/auth/ { proxy_pass http://127.0.0.1:14000/auth/; include snippets/lemone-proxy.conf; }
location /api/work/ { proxy_pass http://127.0.0.1:14000/work/; include snippets/lemone-proxy.conf; }
location /api/activation/ { proxy_pass http://127.0.0.1:14000/activation/; include snippets/lemone-proxy.conf; }
location /api/me/ { proxy_pass http://127.0.0.1:14000/me/; include snippets/lemone-proxy.conf; }
location /api/health { proxy_pass http://127.0.0.1:14000/health; include snippets/lemone-proxy.conf; }
# Keycloak di /auth. Konsol admin tidak dibuka ke internet.
location /auth/admin { return 403; }
location /auth/ { proxy_pass http://127.0.0.1:18080/auth/; include snippets/lemone-proxy.conf; proxy_buffer_size 64k; proxy_buffers 8 64k; }
