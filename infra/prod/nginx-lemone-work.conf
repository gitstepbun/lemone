# Disisipkan ke server block https lemone.work yang sudah ada (include snippets/lemone-work-portal.conf;).
# Portal akun hidup di bawah /akun (Next basePath), IdP di /auth. Situs lama tetap melayani path lainnya.
location = /akun { return 302 /akun/user; }
location /akun/api/auth/ { proxy_pass http://127.0.0.1:14000/auth/; include snippets/lemone-proxy.conf; }
location /akun/api/work/ { proxy_pass http://127.0.0.1:14000/work/; include snippets/lemone-proxy.conf; }
location /akun/api/activation/ { proxy_pass http://127.0.0.1:14000/activation/; include snippets/lemone-proxy.conf; }
location /akun/api/me/ { proxy_pass http://127.0.0.1:14000/me/; include snippets/lemone-proxy.conf; }
location = /akun/api/health { proxy_pass http://127.0.0.1:14000/health; include snippets/lemone-proxy.conf; }
location /akun/activate { proxy_pass http://127.0.0.1:13001; include snippets/lemone-proxy.conf; add_header Cache-Control "no-store" always; add_header Referrer-Policy "no-referrer" always; }
location /akun/ { proxy_pass http://127.0.0.1:13001; include snippets/lemone-proxy.conf; }
# Keycloak di /auth. Konsol admin tidak dibuka ke internet.
location /auth/admin { return 403; }
location /auth/ { proxy_pass http://127.0.0.1:18080/auth/; include snippets/lemone-proxy.conf; proxy_buffer_size 64k; proxy_buffers 8 64k; }
