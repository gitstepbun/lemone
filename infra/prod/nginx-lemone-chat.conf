# Situs lemone.chat (server block baru). TLS ditambahkan certbot.
server {
    listen 80;
    listen [::]:80;
    server_name lemone.chat www.lemone.chat;
    client_max_body_size 25m;
    location /api/ { proxy_pass http://127.0.0.1:4000/; include snippets/lemone-proxy.conf; }
    location /ws { proxy_pass http://127.0.0.1:4000/ws; include snippets/lemone-proxy.conf; proxy_read_timeout 1h; }
    location / { proxy_pass http://127.0.0.1:3002; include snippets/lemone-proxy.conf; }
}
