# Situs lemone.chat (server block baru). TLS ditambahkan certbot.
server {
    listen 80;
    listen [::]:80;
    server_name lemone.chat www.lemone.chat;
    client_max_body_size 25m;
    location /api/ { proxy_pass http://127.0.0.1:14000/; include snippets/lemone-proxy.conf; }
    location /ws {
        proxy_pass http://127.0.0.1:14000/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
    location / { proxy_pass http://127.0.0.1:13002; include snippets/lemone-proxy.conf; }
}
