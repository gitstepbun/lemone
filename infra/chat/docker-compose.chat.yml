# lemone.chat berdiri sendiri: Postgres + API + worker + chat-web. Tanpa Keycloak, tanpa portal.
# Login: username + sandi (AUTH_MODE=local). Semua port hanya di 127.0.0.1; nginx di VPS meneruskan.
#   docker compose -f infra/chat/docker-compose.chat.yml --env-file .env up -d --build
name: lemonechat

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-lemone}
      POSTGRES_PASSWORD: ${PG_SUPERPASSWORD:?set PG_SUPERPASSWORD in .env}
      POSTGRES_DB: lemone
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-unused}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in .env}
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER:-lemone} -d lemone"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: ../../.env
    environment:
      AUTH_MODE: local
      DATABASE_URL: postgres://lemone_api:${API_DB_PASSWORD}@postgres:5432/lemone
    ports: ["127.0.0.1:14000:4000"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: ../../.env
    environment:
      AUTH_MODE: local
      DATABASE_URL: postgres://lemone_api:${API_DB_PASSWORD}@postgres:5432/lemone
      WORKER_ID: worker-1
    depends_on:
      postgres: { condition: service_healthy }

  chat-web:
    build:
      context: ../..
      dockerfile: apps/chat-web/Dockerfile
      args: { NEXT_PUBLIC_WS_URL: "${CHAT_WS_URL}" }
    restart: unless-stopped
    environment: { API_INTERNAL_URL: http://api:4000 }
    ports: ["127.0.0.1:13002:3002"]

volumes:
  pgdata:
